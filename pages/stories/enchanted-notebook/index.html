<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A Story Markets narrative in progress.">
<title>Story Markets — Story</title>
<script src="https://cdn.usefathom.com/script.js" data-site="HBFYHNPH" defer></script>
<style>
:root{--ink:#18201d;--muted:#657169;--paper:#f3f0e8;--card:#fbfaf5;--line:#d9d8ce;--coral:#d95d43;--green:#51745f;--serif:Georgia,"Times New Roman",serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--mono:"SFMono-Regular",Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5}.wrap{max-width:900px;margin:auto;padding:0 24px}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{color:inherit;text-decoration:none;font-weight:750;letter-spacing:-.04em}.logo i{font-style:normal;color:var(--coral)}nav{display:flex;gap:15px}nav a,.source{color:var(--green);text-decoration:none;font:10px var(--mono);text-transform:uppercase}.hero{padding:62px 0 25px}.kicker{font:10px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--coral);font-weight:700}.hero h1{font:400 clamp(45px,8vw,86px)/.93 var(--serif);letter-spacing:-.04em;margin:12px 0}.hero h2{font:400 clamp(24px,4vw,38px)/1.05 var(--serif);margin:0 0 20px}.hero p,.body p{max-width:680px;color:var(--muted);font-size:17px}.media{background:#202b26;border-radius:5px;overflow:hidden;margin:26px 0}.media video{display:block;width:100%;aspect-ratio:16/9;background:#202b26}.pending{border:1px solid var(--line);background:#e5ebe2;padding:28px;border-radius:5px;margin:26px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.button{display:inline-block;border:1px solid var(--ink);border-radius:3px;padding:11px 14px;color:var(--paper);background:var(--ink);text-decoration:none;font-weight:750;font-size:13px}.button.alt{background:transparent;color:var(--ink)}details{border-top:1px solid var(--line);padding:16px 0;color:var(--muted)}summary{cursor:pointer;color:var(--ink);font-weight:700}.source-row{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}footer{border-top:1px solid var(--line);margin-top:60px;padding:22px 0 40px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:20px}@media(max-width:650px){.top{height:auto;padding:16px 0;gap:14px;align-items:flex-start}.hero{padding-top:42px}footer{display:block}footer span{display:block;margin-bottom:8px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><a class="logo" href="/">story<i>.</i>markets</a><nav><a href="/battles/">all stories ↗</a><a href="/">home ↗</a></nav></header>
<main id="story"><p>Loading story…</p></main>
<footer><span>The art is the proof. The audience decides what continues.</span><span>Story Markets takes no platform fee. Stripe processing fees apply.</span></footer>
</div>
<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function slug(){return decodeURIComponent(location.pathname.replace(/^\/stories\//,'').replace(/\/$/,''))}
function render(s){document.title=`${s.title} — story.markets`;const source=s.source_reply_url?`<div class="source-row">Source: <a class="source" href="${esc(s.source_reply_url)}" target="_blank" rel="noopener noreferrer">reply ↗</a> · <a class="source" href="https://x.com/${esc(s.creator_handle)}" target="_blank" rel="noopener noreferrer">@${esc(s.creator_handle)} ↗</a></div>`:'';const media=s.video_url?`<div class="media"><video controls preload="metadata" poster="${esc(s.thumbnail_variants?.[0]||'')}" src="${esc(s.video_url)}"></video></div>`:`<div class="pending"><div class="kicker">Video coming soon</div><p>This story is recorded as a project, but its video and source receipt are not here yet.</p></div>`;const support=s.funding_url?`<a class="button" href="${esc(s.funding_url)}" target="_blank" rel="noopener noreferrer">Fund this story ↗</a>`:'';const transcript=s.transcript?`<details><summary>Read transcript · ${esc((s.transcript_status||'unreviewed').replaceAll('_',' '))}</summary><p>${esc(s.transcript)}</p></details>`:'';$('#story').innerHTML=`<section class="hero"><div class="kicker">Story in progress · ${esc(s.id)}</div><h1>${esc(s.title)}</h1><h2>${esc(s.about)}</h2><p>${esc(s.blurb)}</p></section>${media}<section class="body"><div class="actions">${support}<a class="button alt" href="/battles/">Enter the next battle ↗</a></div>${transcript}${source}</section>`}
(async()=>{try{const r=await fetch('/data/future-radio/stories.json',{cache:'no-store'});const d=await r.json();const s=(d.stories||[]).find(x=>x.slug===slug());if(!s){$('#story').innerHTML='<section class="hero"><div class="kicker">404 · story not found</div><h1>That story has not arrived.</h1><p><a class="source" href="/battles/">Return to the story battles ↗</a></p></section>';return}render(s)}catch{$('#story').innerHTML='<section class="hero"><h1>Story unavailable.</h1><p>Try again or return to the battles.</p></section>'}})();
</script></body></html>
