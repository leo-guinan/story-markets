r('#post-x').href=`https://twitter.com/intent/tweet?text=${encodeURIComponent(`I backed ${name} in the first creator battle. Different tools. Same stage.`)}&url=${encodeURIComponent(shareUrl)}`;document.querySelector('#share').onclick=async()=>{if(navigator.share){try{await navigator.share({title:`I backed ${name}`,text:`I backed ${name} in the first creator battle.`,url:shareUrl})}catch{}}else{document.querySelector('#copy-link').click()}};</script></body></html>
